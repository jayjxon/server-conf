services:
    dispatcharr:
        # all-in-one image: postgres, redis, nginx and the app all live in this container,
        # so it has no dependency on anything outside the VPS
        image: ghcr.io/dispatcharr/dispatcharr:latest
        container_name: dispatcharr
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        # it spawns uwsgi, celery and ffmpeg workers per active stream
        pids_limit: 400
        environment:
            TZ: ${TZ}

            # django signing key. the image can generate one into /data, but releases
            # since 0.13.1 fail to boot when it is missing on a fresh volume, so it is
            # supplied explicitly here
            DJANGO_SECRET_KEY: ${DISPATCHARR_SECRET_KEY:?generate one, see the README}

            DISPATCHARR_ENV: aio
            REDIS_HOST: localhost
            CELERY_BROKER_URL: redis://localhost:6379/0
            DISPATCHARR_LOG_LEVEL: info

            # traefik terminates TLS and proxies from the traefik network, so trust only
            # that subnet for X-Forwarded-* (reverse proxy auth needs this set explicitly)
            DISPATCHARR_TRUSTED_PROXIES: 10.120.0.0/24
        volumes:
            - ${APP_ROOT}/dispatcharr/data:/data
            # the vod -> media library plugin writes the .strm/.nfo tree here; jellyfin
            # mounts the same host directory read-only, so both sides see one copy
            - ${APP_ROOT}/dispatcharr/vods:/VODS
        expose:
            - 9191
        networks:
            - traefik
        labels:
            traefik.enable: true
            traefik.http.routers.dispatcharr-rtr.rule: Host(`dispatcharr.${DOMAINNAME}`)
            traefik.http.routers.dispatcharr-rtr.middlewares: middlewares-authelia@file,dispatcharr-sso
            traefik.http.services.dispatcharr-svc.loadbalancer.server.port: 9191

            # dispatcharr has no login of its own any more: whatever authelia let through
            # arrives as this user. the header is set here, so a client cannot supply it
            traefik.http.middlewares.dispatcharr-sso.headers.customrequestheaders.Remote-User: ${DISPATCHARR_SSO_USER:-admin}

            homepage.group: media
            homepage.name: Dispatcharr
            homepage.icon: mdi-television-guide
            homepage.href: https://dispatcharr.${DOMAINNAME}

    # dispatcharr keeps its postgres and redis inside its own container, so the only way to
    # reach them is to borrow that container's network namespace. this waits for the
    # database and makes sure the sso user and the reverse proxy auth setting exist, so a
    # fresh volume never serves the first-run setup page. runs on every `up -d`, no-op after
    # the first time
    dispatcharr-init:
        image: ghcr.io/dispatcharr/dispatcharr:latest
        container_name: dispatcharr-init
        network_mode: 'service:dispatcharr'
        restart: 'no'
        depends_on:
            - dispatcharr
        environment:
            TZ: ${TZ}
            DISPATCHARR_ENV: aio
            DJANGO_SECRET_KEY: ${DISPATCHARR_SECRET_KEY:?generate one, see the README}
            REDIS_HOST: localhost
            DISPATCHARR_SSO_USER: ${DISPATCHARR_SSO_USER:-admin}
        volumes:
            - ${APP_ROOT}/dispatcharr/data:/data
        entrypoint:
            - python
        command:
            - /dispatcharr-init.py
        configs:
            - source: dispatcharr_init
              target: /dispatcharr-init.py

configs:
    dispatcharr_init:
        content: |
            """One-shot bootstrap: the user dispatcharr signs everyone in as."""
            import os
            import sys
            import time

            # a script's own directory is sys.path[0], not the workdir, so the app package
            # has to be added explicitly
            sys.path.insert(0, "/app")
            os.environ.setdefault("DJANGO_SETTINGS_MODULE", "dispatcharr.settings")

            import django

            django.setup()

            from django.contrib.auth import get_user_model

            from core.models import CoreSettings

            USERNAME = os.environ.get("DISPATCHARR_SSO_USER", "admin")

            for _ in range(60):
                try:
                    User = get_user_model()
                    user, _ = User.objects.get_or_create(
                        username=USERNAME,
                        defaults={"is_staff": True, "is_superuser": True, "user_level": 10},
                    )
                    user.is_staff = True
                    user.is_superuser = True
                    # the first-run setup page closes on user_level, not on is_superuser
                    user.user_level = 10
                    user.set_unusable_password()
                    user.save()
                    CoreSettings.objects.update_or_create(
                        key="reverse_proxy_auth",
                        defaults={
                            "name": "Reverse Proxy Auth",
                            "value": {"enabled": True, "header": "Remote-User"},
                        },
                    )
                    print("dispatcharr-init: ready as", USERNAME)
                    sys.exit(0)
                except Exception as exc:
                    print("dispatcharr-init: waiting for the database:", type(exc).__name__)
                    time.sleep(3)

            print("dispatcharr-init: the database never became ready", file=sys.stderr)
            sys.exit(1)
