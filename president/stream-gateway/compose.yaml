services:
    stream-gateway:
        build:
            context: ../../gateway
            dockerfile: Dockerfile
        container_name: stream-gateway
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        pids_limit: 100
        environment:
            TZ: ${TZ:-Etc/UTC}
            PRESS_PLAYZ_LIBRARY_URL: http://pressplayz-library:8789
        expose:
            - 8790
        networks:
            - traefik
        labels:
            traefik.enable: true
            # stable, content-keyed route; no source name in the path
            traefik.http.routers.stream-gateway-rtr.rule: Host(`scraper.${DOMAINNAME}`) && PathPrefix(`/play`)
            traefik.http.routers.stream-gateway-rtr.middlewares: middlewares-authelia@file
            traefik.http.services.stream-gateway-svc.loadbalancer.server.port: 8790
