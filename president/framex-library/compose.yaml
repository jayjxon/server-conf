services:
    framex-library:
        build:
            context: ../../framex
            dockerfile: Dockerfile
        container_name: framex-library
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        pids_limit: 200
        user: ${PUID}:${PGID}
        environment:
            TZ: ${TZ:-Etc/UTC}
            # same path/tree jellyfin mounts at /data; the writer puts entries
            # under requests/ so the existing request library picks them up
            FRAMEX_MEDIA_DIR: /data
            FRAMEX_PUBLIC_URL: https://scraper.${DOMAINNAME}/framex
            # .strm files use the stable gateway route; the proxy remains
            # under FRAMEX_PUBLIC_URL for the manifest/segment segments.
            FRAMEX_STRM_PUBLIC_URL: https://scraper.${DOMAINNAME}
            FRAMEX_DATA_DIR: /state
            FRAMEX_API_BASE: ${FRAMEX_API_BASE:-https://api.framextv.cc}
            FRAMEX_SITE_URL: ${FRAMEX_SITE_URL:-https://framextv.cc}
        volumes:
            - ${APP_ROOT}/jellyfin/media:/data
            - ${APP_ROOT}/framex-library:/state
        expose:
            - 8789
        networks:
            - traefik
        labels:
            traefik.enable: true
            traefik.http.routers.framex-library-rtr.rule: Host(`scraper.${DOMAINNAME}`) && PathPrefix(`/framex`)
            # authelia sees the prefixed path; traefik strips it before forwarding.
            # only the explicit /play and /p namespaces bypass auth.
            traefik.http.routers.framex-library-rtr.middlewares: middlewares-authelia@file,framex-strip@docker
            traefik.http.middlewares.framex-strip.stripprefix.prefixes: /framex
            traefik.http.services.framex-library-svc.loadbalancer.server.port: 8789
