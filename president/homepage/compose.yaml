services:
    homepage:
        image: gethomepage/homepage:latest
        container_name: homepage
        restart: unless-stopped
        networks:
            - traefik
            - socket_proxy

        security_opt:
            - no-new-privileges:true
        pids_limit: 200
        environment:
            PUID: ${PUID}
            PGID: ${PGID}

            HOMEPAGE_ALLOWED_HOSTS: ${DOMAINNAME}
        volumes:
            # mounted straight onto the path the image reads, no init step involved
            - ./config:/app/config
            - ${APP_ROOT}/homepage/logs:/app/config/logs
        expose:
            - 3000
        labels:
            traefik.enable: true
            traefik.http.routers.homepage-rtr.rule: Host(`${DOMAINNAME}`)
            traefik.http.routers.homepage-rtr.middlewares: middlewares-authelia@file,middlewares-error-pages@file
            traefik.http.routers.homepage-rtr.priority: 25
