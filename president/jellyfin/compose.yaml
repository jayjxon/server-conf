services:
    jellyfin:
        image: jellyfin/jellyfin
        container_name: jellyfin
        security_opt:
            - no-new-privileges:true
        pids_limit: 200
        user: ${PUID}:${PGID}
        # this host has no IPv6 route, but the metadata/image hosts publish AAAA records,
        # so .NET picks an unreachable IPv6 address and every fetch burns the full 100s
        # HttpClient timeout. disabling IPv6 inside the container makes the lookup fail
        # over to IPv4 immediately, which is the difference between ~7 and ~25 items/min
        sysctls:
            - net.ipv6.conf.all.disable_ipv6=1
            - net.ipv6.conf.default.disable_ipv6=1
        environment:
            - TZ=${TZ:-Etc/UTC}
            - JELLYFIN_PublishedServerUrl=https://jellyfin.${DOMAINNAME}
        volumes:
            - ${APP_ROOT}/jellyfin/config:/config
            - ${APP_ROOT}/jellyfin/cache:/cache
            # no /dev/dri and no GPU reservation: this host is a VPS without
            # hardware transcoding, the library lives under APP_ROOT instead
            - ${APP_ROOT}/jellyfin/media:/data
            # dispatcharr's generated VOD library (one .strm per title), read-only so a
            # jellyfin scan can never touch the plugin's output
            - ${APP_ROOT}/dispatcharr/vods:/data/vods:ro
        expose:
            - 8096
        networks:
            - traefik
        restart: unless-stopped
        labels:
            traefik.enable: true
            traefik.http.routers.jellyfin-rtr.rule: Host(`jellyfin.${DOMAINNAME}`)
            traefik.http.services.jellyfin-svc.loadbalancer.server.port: 8096

            homepage.group: media
            homepage.name: Jellyfin
            homepage.icon: sh-jellyfin.svg
            homepage.href: https://jellyfin.${DOMAINNAME}
