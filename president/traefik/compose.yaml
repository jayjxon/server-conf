# extends the common traefik with TLS config,
# since this is the primary reverse proxy

services:
    traefik:
        extends:
            file: ../../common/traefik/compose.yaml
            service: traefik
        container_name: traefik
        networks:
            traefik:
                ipv4_address: 10.120.0.84
            socket_proxy:
        ports:
            - 80:80
            - 443:443
        labels:
            # the dashboard is publicly routed but only reachable after authelia login
            traefik.http.routers.traefik-rtr.middlewares: middlewares-authelia@file
        volumes:
            - "${APP_ROOT}/traefik/logs:/logs"
            - "${APP_ROOT}/traefik/data:/data" # acme.json defined in traefik.yaml
            - "${APP_ROOT}/traefik/plugins:/plugins-storage"
            - ./ban.html:/ban.html
        environment:
            ROOT_DOMAINNAME: ${DOMAINNAME:?needs domain name}

            # crowdsec bouncer, downloaded from the plugin catalogue on startup
            TRAEFIK_EXPERIMENTAL_PLUGINS_BOUNCER_MODULENAME: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
            TRAEFIK_EXPERIMENTAL_PLUGINS_BOUNCER_VERSION: v1.8.2

            # create it once with: docker compose exec crowdsec cscli bouncers add traefik-bouncer
            CROWDSEC_API_KEY: ${CROWDSEC_BOUNCER_LAPI_KEY:?needs a crowdsec bouncer key}

            # bans are applied on every route, including the ones without authelia
            TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_MIDDLEWARES: >-
                middlewares-rate-limit@file,
                middlewares-compress@file,
                middlewares-secure-headers@file,
                middlewares-crowdsec@file
