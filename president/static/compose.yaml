services:
    static:
        image: caddy:latest
        container_name: static
        user: ${PUID}:${PGID}
        security_opt:
            - no-new-privileges:true
        pids_limit: 200
        restart: unless-stopped
        networks:
            - traefik
        expose:
            - 8080
        configs:
            # both carry ${DOMAINNAME}: compose renders them, so neither a
            # startup script nor a caddy template is needed. They are mounted on
            # the container's own filesystem because /www is read-only.
            - source: well_known_matrix_client
              target: /srv/well-known/.well-known/matrix/client
            - source: well_known_openid_configuration
              target: /srv/well-known/.well-known/openid-configuration
        volumes:
            - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
            - ./web:/www:ro

        labels:
            traefik.enable: true
            traefik.http.services.static-svc.loadbalancer.server.port: 8080
            traefik.http.routers.static-rtr.rule: Host(`${DOMAINNAME}`) && PathPrefix(`/.well-known`)
    error-pages:
        image: ghcr.io/tarampampam/error-pages:latest # using the latest tag is highly discouraged
        user: ${PUID}:${PGID}
        container_name: error-pages
        restart: unless-stopped
        pids_limit: 200
        security_opt:
            - no-new-privileges:true
        environment:
            TEMPLATE_NAME: connection # set the error pages template
        networks:
            - traefik
        labels:
            traefik.enable: true
            # use as "fallback" for any NON-registered services (with priority below normal)
            traefik.http.routers.error-pages-rtr.rule: HostRegexp(`.+`) || Host(`error.${DOMAINNAME}`)
            traefik.http.routers.error-pages-rtr.priority: 10

            traefik.http.routers.error-pages-rtr.middlewares: middlewares-error-pages@file

            # define service properties
            traefik.http.services.error-pages-svc.loadbalancer.server.port: 8080

configs:
    well_known_matrix_client:
        content: |
            {
                "m.homeserver": {
                    "base_url": "https://matrix.${DOMAINNAME}"
                },
                "org.matrix.msc2965.authentication": {
                    "issuer": "https://${DOMAINNAME}",
                    "account": "https://matrix-auth.${DOMAINNAME}/account"
                }
            }
    well_known_openid_configuration:
        content: |
            {
                "issuer": "https://${DOMAINNAME}",
                "authorization_endpoint": "https://matrix-auth.${DOMAINNAME}/authorize",
                "token_endpoint": "https://matrix-auth.${DOMAINNAME}/oauth2/token",
                "jwks_uri": "https://matrix-auth.${DOMAINNAME}/oauth2/keys.json",
                "registration_endpoint": "https://matrix-auth.${DOMAINNAME}/oauth2/registration",
                "introspection_endpoint": "https://matrix-auth.${DOMAINNAME}/oauth2/introspect"
            }
