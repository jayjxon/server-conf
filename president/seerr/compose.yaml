services:
    seerr:
        image: ghcr.io/seerr-team/seerr:latest
        container_name: seerr
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        user: ${PUID}:${PGID}
        environment:
            TZ: ${TZ:-Etc/UTC}
            LOG_LEVEL: info
            # pin the key so the fulfiller can authenticate without scraping the UI
            API_KEY: ${SEERR_API_KEY:?set SEERR_API_KEY, see example.env}
        volumes:
            - ${APP_ROOT}/seerr/config:/app/config
        expose:
            - 5055
        networks:
            - traefik
        labels:
            traefik.enable: true
            traefik.http.routers.seerr-rtr.rule: Host(`seerr.${DOMAINNAME}`)
            traefik.http.services.seerr-svc.loadbalancer.server.port: 5055

            homepage.group: media
            homepage.name: Seerr
            homepage.icon: sh-seerr.svg
            homepage.href: https://seerr.${DOMAINNAME}
