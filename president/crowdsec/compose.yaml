services:
    crowdsec:
        image: crowdsecurity/crowdsec:latest
        container_name: crowdsec
        # the image bootstraps /etc/crowdsec with rsync from a root-owned /staging,
        # so it has to run as root; the config dir must be writable by it
        security_opt:
            - no-new-privileges:true
        pids_limit: 200
        environment:
            TZ: ${TZ}
            PUID: ${PUID}
            PGID: ${PGID}
            COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve"
        expose:
            - "8080"
        volumes:
            - ${APP_ROOT}/crowdsec/logs:/var/log/crowdsec:ro
            - ${APP_ROOT}/crowdsec/data:/var/lib/crowdsec/data
            # first start populates this from the image defaults, then it keeps
            # the hub/scenario updates; must be writable by PUID:PGID
            - ${APP_ROOT}/crowdsec/config:/etc/crowdsec

            - ${APP_ROOT}/traefik/logs:/var/log/traefik:ro

            - ./config/acquis.d/50-traefik.yaml:/etc/crowdsec/acquis.d/50-traefik.yaml
            - ./config/enrich/homepage-no-ban.yaml:/etc/crowdsec/parsers/s02-enrich/homepage-no-ban.yaml
        restart: unless-stopped
        labels:
            traefik.enable: false
        networks:
            - traefik
