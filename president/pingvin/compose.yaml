services:
    pingvin-share:
        image: stonith404/pingvin-share # or ghcr.io/stonith404/pingvin-share
        container_name: pingvin-share
        restart: unless-stopped
        user: ${PUID}:${PGID}
        security_opt:
            - no-new-privileges:true
        pids_limit: 200
        environment:
            TRUST_PROXY: true # Set to true if a reverse proxy is in front of the container
            API_URL: https://pingvin.${DOMAINNAME}

        configs:
            # the configuration, oidc client included, comes from this file, so
            # nothing has to be set up in the admin UI. while it exists pingvin
            # serves those settings read-only.
            - source: pingvin_config
              target: /opt/app/config.yaml
        volumes:
            - "${APP_ROOT}/pingvin/uploads/uploads:/opt/app/backend/data/uploads"
            - "${APP_ROOT}/pingvin/data:/opt/app/backend/data"
            - "${APP_ROOT}/pingvin/images:/opt/app/frontend/public/img"

        networks:
            - traefik

        labels:
            traefik.enable: true

            traefik.http.routers.pingvin-share-rtr.rule: Host(`pingvin.${DOMAINNAME}`)

            homepage.group: media
            homepage.name: Pingvin Share
            homepage.icon: sh-pingvin-share.svg
            homepage.href: https://pingvin.${DOMAINNAME}
configs:
    pingvin_config:
        content: |
            # values taken over from the admin UI, plus the authelia oidc client
            general:
                appName: 'File Sharing'
                appUrl: 'https://pingvin.${DOMAINNAME}'
                secureCookies: 'true'
                showHomePage: 'false'
            share:
                allowRegistration: 'false'
                allowUnauthenticatedShares: 'false'
            oauth:
                oidc-enabled: 'true'
                oidc-discoveryUri: 'https://auth.${DOMAINNAME}/.well-known/openid-configuration'
                oidc-clientId: 'pingvin'
                oidc-clientSecret: '${PINGVIN_OIDC_CLIENT_SECRET:?}'
                oidc-signOut: 'true'
                oidc-scope: 'openid email profile groups'

