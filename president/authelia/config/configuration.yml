---
###############################################################
# Authelia (replaces authentik)
#
# Mounted read-only at /config/configuration.yml. Authelia expands the ${...}
# placeholders itself (X_AUTHELIA_CONFIG_FILTERS=expand-env), and the two
# secrets are set through authelia's own environment variables:
# AUTHELIA_SESSION_SECRET and AUTHELIA_STORAGE_ENCRYPTION_KEY.
#
# Authelia is the OIDC provider for pingvin share, and the forward-auth backend
# for the homepage, the traefik dashboard and dispatcharr.
#
# https://www.authelia.com/configuration/prologue/introduction/
###############################################################
theme: 'dark'

server:
    address: 'tcp://0.0.0.0:9091'
    endpoints:
        authz:
            forward-auth:
                implementation: 'ForwardAuth'

log:
    level: 'info'

totp:
    issuer: '${DOMAINNAME}'

authentication_backend:
    # no SMTP notifier in this setup, so password reset is off
    password_reset:
        disable: true

    file:
        # provided by the authelia_users compose config, built from
        # AUTHELIA_ADMIN_PASSWORD_HASH in .env
        path: '/config/users_database.yml'
        password:
            algorithm: 'argon2'
            argon2:
                variant: 'argon2id'
                iterations: 3
                memory: 65536
                parallelism: 4
                key_length: 32
                salt_length: 16

access_control:
    # only routers carrying middlewares-authelia@file are affected,
    # everything else stays public
    default_policy: 'one_factor'
    rules:
        - domain: 'auth.${DOMAINNAME}'
          policy: 'bypass'

        # the VOD proxy is fetched by media players themselves: every .strm in jellyfin's
        # library points at https://dispatcharr.${DOMAINNAME}/proxy/vod/..., and a player
        # cannot complete an authelia redirect. this one path is therefore exempt, and it
        # has to stay before the rule below or that rule would match it first
        - domain: 'dispatcharr.${DOMAINNAME}'
          resources:
              - '^/proxy/vod/.*'
          policy: 'bypass'

        # the Xtream Codes output is fetched by external players (TiviMate etc.). a player
        # cannot complete an authelia redirect and authenticates with the XC password
        # instead, so these paths skip the portal. everything else on the host stays
        # admins-only; keep this rule ahead of the one below.
        - domain: 'dispatcharr.${DOMAINNAME}'
          resources:
              - '^/(get|player_api|panel_api|xmltv)\.php'
              - '^/(live|movie|series|timeshift)/'
              - '^/streaming/timeshift\.php'
          policy: 'bypass'

        # dispatcharr is for the admin account only. anyone else who passes the first
        # factor is refused with 403 here, before the request reaches the app
        - domain: 'dispatcharr.${DOMAINNAME}'
          policy: 'one_factor'
          subject:
              - 'group:admins'

        # all scraper proxies live under one host. authelia sees the prefixed
        # path; traefik strips /anime or /pressplayz before forwarding.
        # only the player namespaces are public; the selector APIs stay admins-only.
        # /play is the source-independent facade used by .strm files.
        - domain: 'scraper.${DOMAINNAME}'
          resources:
              - '^/(anime|pressplayz)/(play|p)/.*'
              - '^/play/.*'
          policy: 'bypass'

        - domain: 'scraper.${DOMAINNAME}'
          policy: 'one_factor'
          subject:
              - 'group:admins'

        # bazarr runs no login of its own (its native oidc needs a release newer than the
        # stable image), so this rule is the only gate, and it is admins only as well
        - domain: 'bazarr.${DOMAINNAME}'
          policy: 'one_factor'
          subject:
              - 'group:admins'

identity_providers:
    oidc:
        # hmac_secret and issuer_private_key are not in this file: they arrive as
        # AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET and
        # AUTHELIA_IDENTITY_PROVIDERS_OIDC_ISSUER_PRIVATE_KEY_FILE
        access_token_lifespan: '1h'
        enforce_pkce: 'public_clients_only'
        clients:
            - client_id: 'pingvin'
              client_name: 'Pingvin Share'
              # pbkdf2 hash of PINGVIN_OIDC_CLIENT_SECRET, see the README
              client_secret: '${PINGVIN_OIDC_CLIENT_SECRET_HASH}'
              public: false
              authorization_policy: 'one_factor'
              redirect_uris:
                  - 'https://pingvin.${DOMAINNAME}/api/oauth/callback/oidc'
              scopes:
                  - 'openid'
                  - 'email'
                  - 'profile'
                  - 'groups'
              userinfo_signed_response_alg: 'none'
              token_endpoint_auth_method: 'client_secret_basic'

session:
    cookies:
        - domain: '${DOMAINNAME}'
          authelia_url: 'https://auth.${DOMAINNAME}'
          default_redirection_url: 'https://${DOMAINNAME}'

regulation:
    max_retries: 3
    find_time: '2m'
    ban_time: '5m'

storage:
    local:
        path: '/config/db.sqlite3'

notifier:
    filesystem:
        filename: '/config/notifications.txt'
