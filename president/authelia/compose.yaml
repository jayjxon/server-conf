services:
    # authelia reads its configuration straight from the repo: configuration.yml
    # is mounted read-only and authelia expands the ${...} placeholders itself,
    # and the users database is a compose config built from the hash in .env
    authelia:
        image: authelia/authelia:4.39.28
        container_name: authelia
        restart: unless-stopped
        user: ${PUID}:${PGID}
        security_opt:
            - no-new-privileges:true
        pids_limit: 200
        networks:
            - traefik
        expose:
            - 9091
        configs:
            - source: authelia_users
              target: /config/users_database.yml
        volumes:
            # read-only: only the state files (db, notifications) get written
            - ./config/configuration.yml:/config/configuration.yml:ro
            - ${APP_ROOT}/authelia/config:/config
        environment:
            TZ: ${TZ}
            DOMAINNAME: ${DOMAINNAME}

            # authelia's own placeholder expansion for configuration.yml
            X_AUTHELIA_CONFIG_FILTERS: 'expand-env'

            # authelia's own environment variables, no templating involved
            AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?}
            AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?}

            # oidc provider: signing key is generated once into APP_ROOT/authelia/config/oidc
            AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: ${AUTHELIA_OIDC_HMAC_SECRET:?}
            AUTHELIA_IDENTITY_PROVIDERS_OIDC_ISSUER_PRIVATE_KEY_FILE: '/config/oidc/issuer.pem'

            # the client hashes are referenced by name in configuration.yml, so they
            # have to be in this container's environment for the expand-env filter
            PINGVIN_OIDC_CLIENT_SECRET_HASH: ${PINGVIN_OIDC_CLIENT_SECRET_HASH:?}

        labels:
            traefik.enable: true
            traefik.http.routers.authelia-rtr.rule: Host(`auth.${DOMAINNAME}`)
            traefik.http.services.authelia-svc.loadbalancer.server.port: 9091

            homepage.group: internal
            homepage.name: Authelia
            homepage.icon: sh-authelia.svg
            homepage.href: https://auth.${DOMAINNAME}

configs:
    authelia_users:
        content: |
            ---
            users:
                admin:
                    displayname: 'Admin'
                    password: '${AUTHELIA_ADMIN_PASSWORD_HASH:?}'
                    email: 'admin@${DOMAINNAME}'
                    groups:
                        - 'admins'
