services:
    # renders configuration.yml into APP_ROOT before authelia starts
    authelia-config:
        # the authelia image is used so the init script can hash the admin
        # password to argon2id itself
        image: authelia/authelia:4.39.28
        container_name: authelia-config
        user: ${PUID}:${PGID}
        entrypoint: ["/bin/sh", "/usr/local/bin/init.sh"]
        network_mode: none
        restart: "no"
        volumes:
            - ./config/configuration.template.yml:/config.template.yml
            - ${APP_ROOT}/authelia/config:/config

            - ./container/init.sh:/usr/local/bin/init.sh
        environment:
            DOMAINNAME: ${DOMAINNAME}

            # plaintext in .env, hashed into users_database.yml at render time
            AUTHELIA_ADMIN_PASSWORD: ${AUTHELIA_ADMIN_PASSWORD:?}
            AUTHELIA_ADMIN_USER: ${AUTHELIA_ADMIN_USER:-admin}
            AUTHELIA_ADMIN_EMAIL: ${AUTHELIA_ADMIN_EMAIL:-}

            SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?}
            STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?}

    authelia:
        image: authelia/authelia:4.39.28
        container_name: authelia
        restart: unless-stopped
        user: ${PUID}:${PGID}
        security_opt:
            - no-new-privileges:true
        pids_limit: 200
        depends_on:
            authelia-config:
                condition: service_completed_successfully
        networks:
            - traefik
        expose:
            - 9091
        volumes:
            - ${APP_ROOT}/authelia/config:/config
        environment:
            TZ: ${TZ}
        labels:
            traefik.enable: true
            traefik.http.routers.authelia-rtr.rule: Host(`auth.${DOMAINNAME}`)
            traefik.http.services.authelia-svc.loadbalancer.server.port: 9091

            homepage.group: internal
            homepage.name: Authelia
            homepage.icon: sh-authelia.svg
            homepage.href: https://auth.${DOMAINNAME}
