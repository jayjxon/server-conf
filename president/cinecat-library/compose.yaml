services:
    cinecat-library:
        build:
            context: ../../cinecat
            dockerfile: Dockerfile
        container_name: cinecat-library
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        pids_limit: 200
        user: ${PUID}:${PGID}
        environment:
            TZ: ${TZ:-Etc/UTC}
            # same path/tree jellyfin mounts at /data; the writer puts entries
            # under requests/ so the existing request library picks them up
            CINECAT_MEDIA_DIR: /data
            CINECAT_PUBLIC_URL: https://scraper.${DOMAINNAME}/cinecat
            CINECAT_DATA_DIR: /state
            CINECAT_SITE_URL: ${CINECAT_SITE_URL:-https://beta.cinecat.eu}
        volumes:
            - ${APP_ROOT}/jellyfin/media:/data
            - ${APP_ROOT}/cinecat-library:/state
        expose:
            - 8788
        networks:
            - traefik
        labels:
            traefik.enable: true
            traefik.http.routers.cinecat-library-rtr.rule: Host(`scraper.${DOMAINNAME}`) && PathPrefix(`/cinecat`)
            # authelia sees the prefixed path; traefik strips it before forwarding.
            # only the explicit /play and /p namespaces bypass auth.
            traefik.http.routers.cinecat-library-rtr.middlewares: middlewares-authelia@file,cinecat-strip@docker
            traefik.http.middlewares.cinecat-strip.stripprefix.prefixes: /cinecat
            traefik.http.services.cinecat-library-svc.loadbalancer.server.port: 8788
