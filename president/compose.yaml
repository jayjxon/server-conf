include:
    # common
    - ../common/socket-proxy/compose.yaml

    # traefik first, everything else hangs off it
    - ./traefik/compose.yaml

    # auth + dashboard
    - ./authelia/compose.yaml
    - ./homepage/compose.yaml

    # services
    - ./jellyfin/compose.yaml
    - ./anime-library/compose.yaml
    - ./framex-library/compose.yaml
    - ./stream-gateway/compose.yaml
    - ./dispatcharr/compose.yaml
    - ./seerr/compose.yaml
    - ./fulfiller/compose.yaml
    - ./bazarr/compose.yaml
    - ./pingvin/compose.yaml
    - ./static/compose.yaml

    # abuse protection, reads the traefik access log.
    # disabled for now: its http-probing scenario banned the owner's own address over
    # dispatcharr's 404 artwork paths. uncomment to bring the service back
    # - ./crowdsec/compose.yaml

    # advertises this host as a tailscale exit node
    - ./exit-node/compose.yaml

networks:
    socket_proxy:
        driver: bridge

    traefik:
        name: traefik
        driver: bridge
        ipam:
            config:
                - subnet: 10.120.0.0/24
