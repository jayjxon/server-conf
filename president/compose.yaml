include:
    # common
    - ../common/socket-proxy/compose.yaml

    # traefik first, everything else hangs off it
    - ./traefik/compose.yaml

    # auth + dashboard
    - ./authelia/compose.yaml
    - ./homepage/compose.yaml

    # services
    - ./jellyfin/compose.yaml
    - ./dispatcharr/compose.yaml
    - ./pingvin/compose.yaml
    - ./static/compose.yaml

    # abuse protection, reads the traefik access log
    - ./crowdsec/compose.yaml

    # not deployed
    # - ./exit-node/compose.yaml # only ever worked as a headscale exit node

networks:
    socket_proxy:
        driver: bridge

    traefik:
        name: traefik
        driver: bridge
        ipam:
            config:
                - subnet: 10.120.0.0/24
