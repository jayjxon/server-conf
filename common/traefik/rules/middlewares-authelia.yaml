http:
    middlewares:
        # https://www.authelia.com/integration/proxies/traefik/
        middlewares-authelia:
            forwardAuth:
                address: 'http://authelia:9091/api/authz/forward-auth'
                trustForwardHeader: true
                authResponseHeaders:
                    - Remote-User
                    - Remote-Groups
                    - Remote-Email
                    - Remote-Name
