# ------------------------------
# -- Socket Proxy
# -- Read-only Docker API proxy for Traefik and Homepage
# ------------------------------
name: socket-proxy # Project Name
services:
    socket-proxy:
        image: tecnativa/docker-socket-proxy:3.4
        container_name: socket-proxy
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        networks:
            - socket_proxy
        #depends_on:
        #  - traefik
        environment:
            - LOG_LEVEL=info # debug,info,notice,warning,err,crit,alert,emerg
            ## Variables match the URL prefix (i.e. AUTH blocks access to /auth/* parts of the API, etc.).
            ### 0 to revoke access.
            ### 1 to grant access.
            ## Granted by Default
            - EVENTS=1
            - PING=1
            - VERSION=1
            ## Revoked by Default
            ### Security critical
            - AUTH=0
            - SECRETS=0
            - POST=0
            ### Not always needed
            - BUILD=0
            - COMMIT=0
            - CONFIGS=0
            - CONTAINERS=1 # Traefik
            - DISTRIBUTION=0
            - EXEC=0
            - IMAGES=0
            - INFO=0
            - NETWORKS=0
            - NODES=0
            - PLUGINS=0
            - SERVICES=0
            - SESSION=0
            - SWARM=0
            - SYSTEM=0
            - TASKS=0
            - VOLUMES=0
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock:ro"
